<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าจอนำเสนอ (Viewer)</title>
    <style>
        body { 
            margin: 0; 
            height: 100vh; 
            background-color: black; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        #viewer-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ค่าเริ่มต้น */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            /* ป้องกันภาพแตกเวลาย่อขยาย */
            transform: translateZ(0);
            backface-visibility: hidden;
        }
    </style>
</head>
<body>
    <img id="viewer-image" src="" alt="">
    
    <script>
        // รอรับคำสั่งรูปภาพที่ส่งมาจากแผงควบคุม (Controller)
        window.addEventListener('message', function(event) {
            const data = event.data;
            
            if (data && data.type === 'SYNC_STATE') {
                const imgEl = document.getElementById('viewer-image');
                
                if (!data.image) {
                    imgEl.style.opacity = 0;
                    return;
                }

                // ซ่อนรูปเก่าเพื่อทำเอฟเฟกต์เฟด (Fade)
                imgEl.style.opacity = 0;
                
                setTimeout(() => {
                    imgEl.src = data.image.url;
                    // สลับโหมดเต็มจอ หรือ ขยายเต็ม (ยืดภาพ)
                    imgEl.style.objectFit = data.mode === 'contain' ? 'contain' : 'fill';
                    
                    // แสดงรูปเมื่อรูปโหลดเสร็จสมบูรณ์
                    imgEl.onload = () => {
                        imgEl.style.opacity = 1;
                    };
                }, 300);
            }
        });
    </script>
</body>
</html>
